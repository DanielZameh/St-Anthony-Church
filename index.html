<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>كنيسة الأنبا أنطونيوس القبطية الأرثوذكسية | الموقع الرسمي</title>
  <meta name="description" content="الموقع الرسمي لكنيسة الأنبا أنطونيوس القبطية الأرثوذكسية في شبرا، القاهرة. اعرف مواعيد القداسات والفعاليات والأخبار."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet"/>
  <style>
    :root {
      --navy:#001a38;--navy-deep:#001226;--navy-mid:#0d2d55;
      --gold:#C9A84C;--gold-light:#e8c96e;--gold-pale:rgba(201,168,76,0.12);
      --cream:#fdf8f0;--white:#ffffff;--gray:#6b7280;--gray-light:#f3f4f6;
      --text:#1f2937;--shadow:0 8px 32px rgba(0,26,56,0.08);
      --shadow-lg:0 16px 48px rgba(0,26,56,0.15);--radius:1rem;
      --transition:0.3s cubic-bezier(0.4,0,0.2,1);--header-h:72px;
      --green:#22c55e;--red:#ef4444;
    }
    .dark{
      --navy:#0a1628;--navy-deep:#060e1c;--cream:#0f1c30;--white:#1a2740;
      --gray-light:#132035;--text:#e5e7eb;--gray:#9ca3af;
      --shadow:0 8px 32px rgba(0,0,0,0.3);--shadow-lg:0 16px 48px rgba(0,0,0,0.4);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    h1,h2,h3,h4,p,a,span,li,button,label{overflow-wrap:break-word;word-break:break-word}
    html{scroll-behavior:smooth;overflow-x:hidden;width:100%}
    body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--text);transition:background var(--transition),color var(--transition);direction:rtl;min-height:100vh;overflow-x:hidden}
    h1,h2,h3,h4{font-family:'Cairo',sans-serif;font-weight:700}
    a{text-decoration:none;color:inherit}
    ul{list-style:none}
    img{max-width:100%;display:block}
    button{cursor:pointer;font-family:inherit;border:none;outline:none;background:none}
    input,textarea,select{font-family:inherit}
    .page-view{display:none}
    .page-view.active{display:block}
    .container{max-width:1100px;margin:0 auto;padding:0 1.5rem}
    .section{padding-top:6rem;padding-bottom:3rem}
    .section-label{display:block;font-size:.75rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem;text-align:center}
    .section-title{font-size:clamp(1.75rem,4vw,2.5rem);text-align:center;color:var(--navy);margin-bottom:3rem}
    .dark .section-title{color:var(--gold-light)}
    .header{position:fixed;top:0;left:0;width:100%;height:var(--header-h);z-index:1000;transition:background var(--transition),box-shadow var(--transition),opacity var(--transition),visibility var(--transition)}
    .header.scrolled{background:var(--navy);box-shadow:var(--shadow)}
    .header.header-hidden{opacity:0;visibility:hidden;pointer-events:none}
    .nav{height:100%;display:flex;align-items:center;justify-content:space-between}
    .nav-logo{display:flex;align-items:center;gap:.75rem;cursor:pointer}
    .nav-logo img{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
    .nav-logo span{font-size:1.1rem;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nav-links{display:flex;gap:2rem}
    .nav-links a{font-size:.9rem;font-weight:500;color:rgba(255,255,255,.85);transition:color var(--transition);position:relative;padding-bottom:4px;cursor:pointer}
    .nav-links a::after{content:'';position:absolute;bottom:0;right:0;width:0;height:2px;background:var(--gold);transition:width var(--transition)}
    .nav-links a:hover,.nav-links a.active{color:var(--gold)}
    .nav-links a:hover::after,.nav-links a.active::after{width:100%}
    .nav-actions{display:flex;align-items:center;gap:.75rem}
    .btn-icon{background:none;color:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;transition:color var(--transition);font-size:1.2rem}
    .btn-icon:hover{color:var(--gold)}
    .btn-admin{font-size:.8rem;font-weight:600;padding:.45rem 1rem;border-radius:99px;background:var(--gold);color:var(--navy-deep);transition:transform var(--transition),background var(--transition)}
    .btn-admin:hover{background:var(--gold-light);transform:translateY(-1px)}
    .nav-toggle{display:none;font-size:1.5rem;color:#fff;background:none}
    @media(max-width:768px){
      .nav-links{display:none;position:fixed;top:var(--header-h);right:0;width:100%;background:var(--navy-deep);flex-direction:column;align-items:center;gap:0;padding:1.5rem 0}
      .nav-links.open{display:flex}
      .nav-links a{padding:.75rem 2rem;width:100%;text-align:center}
      .nav-toggle{display:flex;align-items:center}
      .btn-admin{display:inline-block;font-size:.75rem;padding:.35rem .8rem}
      .nav{gap:.5rem}
      .nav-logo{flex-shrink:1;min-width:0}
      .nav-logo span{max-width:130px}
      .nav-actions{flex-shrink:0;gap:.5rem}
    }
    @media(max-width:400px){
      .nav-logo span{display:none}
    }
    .login-screen{position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#001226 0%,#0d2d55 60%,#1a4a7a 100%);display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .login-screen::before{content:'☩';position:absolute;font-size:30rem;color:rgba(201,168,76,.04);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;line-height:1}
    .login-box{background:var(--white);border-radius:1.25rem;padding:3rem 2.5rem;width:100%;max-width:420px;text-align:center;box-shadow:0 16px 48px rgba(0,26,56,0.15);position:relative;transition:background var(--transition)}
    .dark .login-box{background:#132035}
    .login-logo{width:72px;height:72px;border-radius:50%;border:3px solid var(--gold);margin:0 auto 1.25rem;display:block;object-fit:cover}
    .login-title{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--navy);margin-bottom:.25rem}
    .dark .login-title{color:var(--gold-light)}
    .login-sub{font-size:.8rem;color:var(--gray);margin-bottom:2rem}
    .login-form{display:grid;gap:1rem;text-align:right}
    .login-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);display:block;margin-bottom:.35rem}
    .login-input-wrap{position:relative}
    .login-input-wrap i{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);color:var(--gold);font-size:1.1rem}
    .login-input{width:100%;padding:.85rem 2.75rem .85rem 1rem;border-radius:.6rem;background:var(--gray-light);border:1.5px solid #e2e8f0;color:var(--text);font-size:.9rem;outline:none;font-family:inherit;transition:border-color .2s}
    .dark .login-input{border-color:rgba(201,168,76,.25)}
    .login-input:focus{border-color:var(--gold)}
    .login-btn{padding:.9rem;border-radius:.6rem;background:var(--navy);color:#fff;font-weight:700;font-size:.95rem;font-family:inherit;cursor:pointer;border:none;transition:all .25s;margin-top:.5rem}
    .login-btn:hover{background:var(--navy-deep);transform:translateY(-2px)}
    .login-error{color:var(--red);font-size:.82rem;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:.4rem;padding:.6rem .9rem;display:none;margin-top:.25rem}
    .login-error.show{display:block}
  </style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-box">
    <img class="login-logo" src="https://yt3.googleusercontent.com/fDYMuJkul64KgPbt9c-u9v6JfRH1Kdz-1ugEk1uwnlohvQJUP56XnqV4f25HqqHtQSpeahv7MQ=s160-c-k-c0x00ffffff-no-rj" alt="logo"/>
    <h2 class="login-title">مرحباً بك</h2>
    <p class="login-sub">الإدارة - كنيسة الأنبا أنطونيوس</p>
    <form class="login-form" id="login-form">
      <div class="login-input-wrap">
        <label class="login-label">اسم المستخدم</label>
        <input type="text" id="login-user" class="login-input" placeholder="أدخل اسم المستخدم" required/>
        <i class="ri-user-line"></i>
      </div>
      <div class="login-input-wrap">
        <label class="login-label">كلمة المرور</label>
        <input type="password" id="login-pass" class="login-input" placeholder="أدخل كلمة المرور" required/>
        <i class="ri-lock-line"></i>
      </div>
      <button type="submit" class="login-btn">دخول</button>
      <div class="login-error" id="login-error">بيانات دخول غير صحيحة</div>
    </form>
  </div>
</div>

<script>
  // Admin credentials
  const ADMIN_USER = 'Media';
  const ADMIN_PASS = 'Media';

  function initializeLogin() {
    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('login-user').value;
      const password = document.getElementById('login-pass').value;
      const errorDiv = document.getElementById('login-error');

      if (username === ADMIN_USER && password === ADMIN_PASS) {
        errorDiv.classList.remove('show');
        sessionStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('adminLoggedIn', 'true');
        window.location.reload();
      } else {
        errorDiv.classList.add('show');
      }
    });

    // Check if already logged in
    if (sessionStorage.getItem('adminLoggedIn') || localStorage.getItem('adminLoggedIn')) {
      document.getElementById('login-screen').style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', initializeLogin);
</script>

</body>
</html>
